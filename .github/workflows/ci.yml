name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions: {}

jobs:
  build-default:
    name: Build Piantor Pro default firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    env:
      KEYBOARD: beekeeb/piantor_pro
      KEYMAP: default

    steps:
    - name: Checkout firmware
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        submodules: recursive

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt
        if ! qmk mass-compile -j "$(nproc)" "${KEYBOARD}:${KEYMAP}";
          then
          failure_count="$(find .build -maxdepth 1 -type f -name 'failed.log.*' 2>/dev/null | wc -l)"
          echo "::error::${failure_count} keymaps failed to build. See logs and/or job summary for details."
          exit 1
        fi

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: piantor-pro-default
        path: beekeeb_piantor_pro_default.uf2
        if-no-files-found: error

    - name: Dump failure logs
      if: ${{ failure() && steps.build.conclusion == 'failure' }}
      run: |
        echo '### Failure logs' | tee -a "${GITHUB_STEP_SUMMARY}"

        cd .build || exit 1
        for log in failed.log.*; do
          pretty_logname="$(echo "${log}" | sed "s/^failed\.log\.[0-9]\+\.// ; s/\.${KEYMAP}$//")"

          printf '\n::group::%s\n%s\n::endgroup::\n' "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT}" < "${log}")"
          printf '\n<details>\n<summary>%s</summary>\n\n```\n%s\n```\n\n</details>\n' \
             "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT} ; ${REGEX_ANSI_COLOR}" < "${log}")" >> "${GITHUB_STEP_SUMMARY}"
        done
